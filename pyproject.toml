[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "larder"
dynamic = ["version"]
description = "Self-hosted, FLOSS household food system: recipes, weekly dinner planning and a shared shopping list."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"

[tool.setuptools.dynamic]
version = { attr = "larder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
# Exclude sibling git worktrees (agent work trees) from lint and format runs.
extend-exclude = [".worktrees"]
