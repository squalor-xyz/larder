<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}larder{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <meta name="theme-color" content="#0f1419">
    <link rel="stylesheet" href="{{ url_for('static', filename='larder.css') }}">
    <script src="{{ url_for('static', filename='register-sw.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-name" href="/">larder</a>
        {% if person %}<a href="{{ url_for('recipes.recipe_list') }}">Recipes</a>{% endif %}
        {% if person and person.role == "admin" %}
        <nav class="site-nav" aria-label="Admin">
          <a href="{{ url_for('admin.devices') }}">Devices</a>
          <a href="{{ url_for('admin.review_queue') }}">Parse review ({{ review_count }})</a>
          <a href="{{ url_for('admin.recipe_repo') }}">Recipe repo</a>
        </nav>
        {% endif %}
      </div>
    </header>
    <main>
      {% block main %}{% endblock %}
    </main>
  </body>
</html>
