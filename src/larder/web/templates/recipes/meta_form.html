{% extends "base.html" %}
{% block title %}Edit {{ recipe.title }} - larder{% endblock %}
{% block main %}
<h1>Edit metadata: {{ recipe.title }}</h1>
<p>Recipe content is edited in the recipe repository.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Meal type <select name="meal_type">
    <option value="">Not set</option>
    {% for value in meal_types %}<option value="{{ value }}"{% if recipe.meal_type == value %} selected{% endif %}>{{ value | capitalize }}</option>{% endfor %}
  </select></label>
  <label>Servings <input type="number" name="servings" min="1" step="1" value="{{ recipe.servings if recipe.servings is not none else '' }}"></label>
  <label><input type="checkbox" name="in_rotation" value="1"{% if recipe.in_rotation %} checked{% endif %}> In rotation</label>
  <label><input type="checkbox" name="favorite" value="1"{% if recipe.favorite %} checked{% endif %}> Favorite</label>
  <label>Effort <select name="effort">
    <option value="">Not set</option>
    {% for value in efforts %}<option value="{{ value }}"{% if recipe.effort == value %} selected{% endif %}>{{ value | capitalize }}</option>{% endfor %}
  </select></label>
  <button type="submit">Save metadata</button>
</form>
<p><a href="{{ url_for('recipes.recipe_view', recipe_id=recipe.id) }}">Cancel</a></p>
{% endblock %}
